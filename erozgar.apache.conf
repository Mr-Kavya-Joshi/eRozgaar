# Apache 2.4 virtual host. Enable once: a2enmod proxy proxy_http headers  (XAMPP: uncomment mod_proxy and mod_proxy_http in httpd.conf)
# Apache serves the page and forwards /api to the Node app, which holds the TinyFish key and talks to MySQL.
<VirtualHost *:80>
  ServerName erozgar.local
  DocumentRoot "/var/www/erozgar"
  <Directory "/var/www/erozgar">
    Require all granted
    Options -Indexes
  </Directory>
  <FilesMatch "^(\.env.*|server\.js|schema\.sql|package.*\.json)$">
    Require all denied
  </FilesMatch>
  ProxyPreserveHost On
  ProxyPass        /api http://127.0.0.1:3000/api
  ProxyPassReverse /api http://127.0.0.1:3000/api
</VirtualHost>
